<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Utilisateurs — Back-office SocialNet ESGIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
<div class="admin-shell">
  <div id="navbar-mount"></div>
  <main class="admin-main">
    <h2 class="admin-title">Utilisateurs</h2>
    <p class="admin-sub">Gestion des comptes de la plateforme</p>

    <div class="composer-extra" style="margin-bottom:16px;max-width:320px;">
      <input type="text" id="users-search" placeholder="Rechercher..." style="flex:1;border:1px solid var(--border);border-radius:999px;padding:9px 16px;font-size:13px;">
    </div>

    <table>
      <thead><tr><th>Nom</th><th>Email</th><th>Rôle</th><th>Inscrit le</th><th></th></tr></thead>
      <tbody id="users-tbody"><tr><td colspan="5">Chargement...</td></tr></tbody>
    </table>
  </main>
</div>

<script src="../../assets/js/common.js"></script>
<script src="../../assets/js/admin.js"></script>
<script>
  const currentUser = requireAdminAuth();
  if (currentUser) {
    mountAdminNavbar('utilisateurs');
    loadAdminUsers();
    document.getElementById('users-search').addEventListener('keyup', (e) => loadAdminUsers(e.target.value.trim()));
  }
</script>
</body>
</html>
