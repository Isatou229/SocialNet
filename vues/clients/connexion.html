<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — SocialNet ESGIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/css/style.css">
</head>
<body>
<section class="auth-view">
  <div class="auth-card">
    <div class="brand"><span class="dot"></span><span class="word">Social<b>Net</b></span></div>
    <p class="auth-sub">Réseau social — projet ESGIS</p>

    <form id="form-login">
      <div class="field"><label>Email</label><input type="email" id="login-email" placeholder="toi@esgis.bj" required></div>
      <div class="field"><label>Mot de passe</label><input type="password" id="login-password" placeholder="••••••••" required></div>
      <button class="btn-primary" type="submit">Se connecter</button>
      <p class="form-msg" id="login-msg"></p>
    </form>

    <div class="auth-links">
      <a href="inscription.html">Créer un compte</a>
      <a href="mot-de-passe-oublie.html">Mot de passe oublié ?</a>
    </div>
  </div>
</section>
<script src="../../assets/js/common.js"></script>
<script src="../../assets/js/auth.js"></script>
</body>
</html>
